plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

mixin {
    add sourceSets.main, 'mixins.everlaartifacts.refmap.json'
    config 'mixins.everlaartifacts.json'
}

// 从 mods.toml 文件中读取版本信息
def getModVersion() {
    def modsToml = file('src/main/resources/META-INF/mods.toml')
    if (modsToml.exists()) {
        def content = modsToml.text
        def versionMatch = content =~ /version="([^"]+)"/
        if (versionMatch) {
            return versionMatch[0][1]
        }
    }
    return '1.0.0' // 默认版本
}

def modVersion = getModVersion()
version = modVersion + '-forge-1.20.1'
group = 'net.everla'
archivesBaseName = 'EverlaArtifacts'

println "构建版本: ${version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                jvmArgs += mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.toList()
            }
            // 添加额外的JVM参数来解决模块系统冲突
            jvmArgs += ['-XX:+AllowEnhancedClassLoading', '-XX:+IgnoreUnrecognizedVMOptions', '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED', '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens', 'java.base/java.io=ALL-UNNAMED', '--add-opens', 'java.base/java.net=ALL-UNNAMED', '--add-opens', 'java.base/java.nio=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED', '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED', '--add-opens', 'java.base/java.util.concurrent.atomic=ALL-UNNAMED', '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED', '--add-opens', 'java.base/sun.nio.cs=ALL-UNNAMED', '--add-opens', 'java.base/sun.security.action=ALL-UNNAMED', '--add-opens', 'java.base/sun.util=ALL-UNNAMED']
        }

        server {
            jvmArgs += ['-XX:+AllowEnhancedClassLoading', '-XX:+IgnoreUnrecognizedVMOptions', '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED', '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens', 'java.base/java.io=ALL-UNNAMED', '--add-opens', 'java.base/java.net=ALL-UNNAMED', '--add-opens', 'java.base/java.nio=ALL-UNNAMED', '--add-opens', 'java.base/java.util=ALL-UNNAMED', '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED', '--add-opens', 'java.base/java.util.concurrent.atomic=ALL-UNNAMED', '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED', '--add-opens', 'java.base/sun.nio.cs=ALL-UNNAMED', '--add-opens', 'java.base/sun.security.action=ALL-UNNAMED', '--add-opens', 'java.base/sun.util=ALL-UNNAMED']
        }

        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'JEI Maven'
        url = 'https://maven.blamejared.com/'
    }
    //maven {
    //    name = "Iron's Maven - Release"
    //    url = "https://code.redspace.io/releases"
    //}
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.21'

    // Mixin 注解处理器 — 生成 refmap 文件（生产环境必需）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI Integration
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    //irons_spellbooks
    //runtimeOnly fg.deobf("io.redspace:irons_lib:1.20.1-${irons_lib_version}")
    //compileOnly fg.deobf("io.redspace:irons_spellbooks:1.20.1-${irons_spell_version}:api")
    //runtimeOnly fg.deobf("io.redspace:irons_spellbooks:1.20.1-${irons_spell_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}